# Supabase Configuration for HyperGain
# site_url stays on the live test host until hypergain.io DNS is verified.

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Keep vercel as Site URL so current testing keeps working.
site_url = "https://monadier.vercel.app"
additional_redirect_urls = [
  "https://monadier.vercel.app/auth/callback",
  "https://monadier.vercel.app/reset-password",
  "https://hypergain.io/auth/callback",
  "https://hypergain.io/reset-password",
  "https://www.hypergain.io/auth/callback",
  "https://www.hypergain.io/reset-password",
  "https://app.hypergain.io/auth/callback",
  "https://app.hypergain.io/reset-password",
  "https://app.monadier.io/auth/callback",
  "https://app.monadier.io/reset-password",
  "https://www.monadier.io/auth/callback",
  "https://www.monadier.io/reset-password",
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/reset-password",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = true

# Google Client ID/Secret live only in the Supabase Dashboard — omit provider
# block here so `config push` does not disable Google.

[auth.external.discord]
enabled = false

[analytics]
enabled = false

[functions.stripe-checkout]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.manage-subscription]
verify_jwt = true

[functions.activate-license]
verify_jwt = true

[functions.send-support-message]
verify_jwt = true
