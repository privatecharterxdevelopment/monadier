<!doctype html>
<html lang="en" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply stored landing theme before first paint (prevents white flash on load / nav) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('landing-theme');
          if (t !== 'dark' && t !== 'light') t = 'light';
          document.documentElement.dataset.landingTheme = t;
          document.documentElement.style.colorScheme = t;
          if (t === 'dark') {
            document.documentElement.style.backgroundColor = '#000000';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://www.hypergain.io/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!-- Mobile App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HyperGain" />
    <meta name="theme-color" content="#e8e8ec" />
    <script>
      (function () {
        try {
          if (document.documentElement.dataset.landingTheme === 'dark') {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#000000');
          }
        } catch (e) {}
      })();
    </script>

    <!-- SEO Meta Tags (fallback for crawlers — per-route tags via react-helmet-async) -->
    <meta name="description" content="HyperGain is a full auto Hyperliquid trading bot. Deposit native USDC on Arbitrum, approve the agent once, and let the bot scan 200+ perpetual markets 24/7 — non-custodial. No guaranteed returns." />
    <meta name="keywords" content="hyperliquid bot, hyperliquid trading bot, full auto trading bot, automated trading bot, crypto trading bot, hyperliquid perpetuals bot, non-custodial trading bot, HyperGain" />
    <meta name="author" content="HyperGain" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph / Social Media — absolute URLs for crawlers -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.hypergain.io/" />
    <meta property="og:site_name" content="HyperGain" />
    <meta property="og:title" content="HyperGain | Hyperliquid Trading Bot — Full Auto 24/7" />
    <meta property="og:description" content="Full auto Hyperliquid trading bot. Native USDC on Arbitrum, non-custodial agent, 24/7 across 200+ perps. No guaranteed returns." />
    <meta property="og:image" content="https://www.hypergain.io/og-image-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HyperGain | Hyperliquid Trading Bot — Full Auto 24/7" />
    <meta name="twitter:description" content="Full auto Hyperliquid trading bot. Non-custodial, 24/7 across 200+ HL markets. No guaranteed returns." />
    <meta name="twitter:image" content="https://www.hypergain.io/og-image-v2.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Hero video: start download before React boots (mp4 = universal; webm via <source>) -->

  </head>

</html>
