<!doctype html>
<html lang="en" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <!-- Mobile App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HyperGain" />
    <meta name="theme-color" content="#e8e8ec" />

    <!-- SEO Meta Tags (fallback for crawlers — per-route tags via react-helmet-async) -->
    <meta name="description" content="HyperGain is a full auto Hyperliquid trading bot. Non-custodial USDC on HL, 200+ perpetual markets, 24/7 passive income automation — live charts and bot controls in one terminal." />
    <meta name="keywords" content="hyperliquid bot, hyperliquid trading bot, full auto trading bot, automated trading bot, passive income bot, crypto trading bot, hyperliquid perpetuals bot, non-custodial HL trading, HyperGain" />
    <meta name="author" content="HyperGain" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph / Social Media — absolute URLs for crawlers -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.hypergain.io/" />
    <meta property="og:site_name" content="HyperGain" />
    <meta property="og:title" content="HyperGain | Hyperliquid Trading Bot — Full Auto 24/7" />
    <meta property="og:description" content="Full auto Hyperliquid trading bot. Non-custodial USDC on HL, 24/7 execution across 200+ perpetual markets." />
    <meta property="og:image" content="https://www.hypergain.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HyperGain | Hyperliquid Trading Bot — Full Auto 24/7" />
    <meta name="twitter:description" content="Full auto Hyperliquid trading bot. Non-custodial, 24/7 passive income automation across 200+ HL markets." />
    <meta name="twitter:image" content="https://www.hypergain.io/og-image.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "HyperGain Hyperliquid Trading Bot",
      "url": "https://www.hypergain.io/",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "description": "Full auto Hyperliquid trading bot with non-custodial USDC on HL, live charts, and 24/7 automated execution across 200+ perpetual markets.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "No platform subscription; no HyperGain success fee on closes"
      },
      "featureList": [
        "Full auto Hyperliquid trading bot",
        "Non-custodial Hyperliquid account trading",
        "200+ Hyperliquid perpetual markets",
        "24/7 passive income automation",
        "Live chart terminal",
        "Automated risk management"
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Hero video: start download before React boots (mp4 = universal; webm via <source>) -->
    <link rel="preload" as="image" href="/videos/hero-bg-poster.jpg" fetchpriority="high" />
    <link rel="preload" as="video" href="/videos/hero-bg.mp4" type="video/mp4" fetchpriority="high" />
    <title>HyperGain | Hyperliquid Trading Bot — Full Auto 24/7</title>
  </head>
  <body class="bg-background text-[#0a0a0a] font-sans antialiased">

  </body>
</html>
