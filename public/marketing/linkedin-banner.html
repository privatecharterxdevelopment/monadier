<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HyperGain · LinkedIn Banner</title>
    <style>
      :root {
        --hg-green: #3dd68c;
        --hg-bg: #ffffff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #e8e8e8;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        color: #111;
      }

      .stage {
        width: min(1584px, 96vw);
      }

      .label {
        margin-bottom: 12px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #888;
      }

      .banner {
        position: relative;
        width: 100%;
        aspect-ratio: 1584 / 396;
        overflow: hidden;
        border-radius: 8px;
        background: var(--hg-bg);
        isolation: isolate;
        border: 1px solid rgba(0, 0, 0, 0.06);
      }

      .glow {
        position: absolute;
        left: 50%;
        top: 42%;
        width: 70%;
        height: 120%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        background: radial-gradient(
          ellipse 55% 42% at 50% 50%,
          rgba(61, 214, 140, 0.28) 0%,
          rgba(61, 214, 140, 0.1) 40%,
          transparent 70%
        );
        filter: blur(32px);
        animation: glowPulse 5.5s ease-in-out infinite;
      }

      .content {
        position: relative;
        z-index: 2;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(12px, 1.6vw, 18px);
        padding: 4%;
      }

      .logo {
        width: min(520px, 42%);
        height: auto;
        animation: logoIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .tag {
        font-size: clamp(13px, 1.35vw, 20px);
        font-weight: 500;
        letter-spacing: -0.02em;
        color: #000;
        animation: logoIn 1.1s 0.12s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .tag em {
        font-style: normal;
        color: var(--hg-green);
        font-weight: 600;
      }

      .hint {
        margin-top: 14px;
        font-size: 13px;
        color: #777;
        line-height: 1.45;
      }

      @keyframes glowPulse {
        0%,
        100% {
          opacity: 0.75;
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.05);
        }
      }

      @keyframes logoIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <p class="label">LinkedIn cover · 1584×396 · real logo</p>
      <div class="banner" role="img" aria-label="HyperGain LinkedIn banner">
        <div class="glow" aria-hidden="true"></div>
        <div class="content">
          <img class="logo" src="/images/brand/hypergain-logo.png" alt="HyperGain" />
          <p class="tag">Full auto <em>AI trading Agent</em></p>
        </div>
      </div>
      <p class="hint">Static export: <code>public/marketing/linkedin-banner-hypergain.png</code></p>
    </div>
  </body>
</html>
