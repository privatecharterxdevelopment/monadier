# Monorepo deploy for bot-service — leave Railway "Root Directory" EMPTY.
# See docs/RAILWAY.md if builds fail with "snapshot-target-unpack/bot-service: no such file".

[build]
builder = "DOCKERFILE"
dockerfilePath = "railway.bot.Dockerfile"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
